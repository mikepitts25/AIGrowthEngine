<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIGrowthEngine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .nav-btn.active { background-color: rgb(30 41 59); color: #fff; }
    textarea { resize: vertical; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-56 bg-slate-900 text-slate-300 flex flex-col shrink-0">
      <div class="px-5 py-5 border-b border-slate-800">
        <h1 class="text-white font-bold text-lg leading-tight">🚀 AIGrowth<span class="text-emerald-400">Engine</span></h1>
        <p class="text-xs text-slate-500 mt-1">Grow your business on autopilot</p>
      </div>
      <nav class="flex-1 py-3 space-y-1 px-2">
        <button data-view="dashboard" class="nav-btn w-full text-left px-3 py-2 rounded-lg hover:bg-slate-800 text-sm">📊 Dashboard</button>
        <button data-view="discover"  class="nav-btn w-full text-left px-3 py-2 rounded-lg hover:bg-slate-800 text-sm">🔎 Find Leads</button>
        <button data-view="leads"     class="nav-btn w-full text-left px-3 py-2 rounded-lg hover:bg-slate-800 text-sm">👥 Leads</button>
        <button data-view="content"   class="nav-btn w-full text-left px-3 py-2 rounded-lg hover:bg-slate-800 text-sm">✍️ Content Studio</button>
        <button data-view="settings"  class="nav-btn w-full text-left px-3 py-2 rounded-lg hover:bg-slate-800 text-sm">⚙️ Settings</button>
      </nav>
      <div class="px-5 py-4 border-t border-slate-800 text-xs">
        <span id="ai-badge" class="inline-flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-slate-600"></span> AI: checking…</span>
      </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 p-6 lg:p-8 overflow-x-hidden">
      <div id="view-root" class="max-w-5xl mx-auto"></div>
    </main>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-5 right-5 hidden bg-slate-900 text-white text-sm px-4 py-2.5 rounded-lg shadow-lg"></div>

  <script src="/static/app.js"></script>
</body>
</html>
